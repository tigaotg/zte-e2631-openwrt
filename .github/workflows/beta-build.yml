name: Beta candidate build (UNVERIFIED)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2631-beta-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/beta/public-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      E2631_TREE: ${{ runner.temp }}/openwrt
      E2631_WORK: ${{ runner.temp }}/e2631-work
      E2631_OUT: ${{ runner.temp }}/e2631-work/out
      E2631_BASE_SHA: db8b8d4130457dbe46558a7cea872dd2dae539e6
      E2631_PACKAGES_SHA: 05d12617f1bcd35fa09803c708a564e32e9dd665
      E2631_LUCI_SHA: 1c67452adb01413e78feb109180bd15186612ead

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenWrt build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext libncurses-dev python3 rsync swig unzip zlib1g-dev file wget git curl busybox ccache
      - name: Resource check and package isolation
        run: |
          mkdir -p "$E2631_WORK"
          df -h "$RUNNER_TEMP"
          available_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if [ "$available_kb" -lt 12582912 ]; then
            echo "::error::Need at least 12 GiB free before bootstrap. Use a larger runner."
            exit 1
          fi
      - name: Prebuild source gates
        run: |
          make check
          python3 tests/test_userdata_init.py
          python3 tests/test_extroot_audit.py
          python3 tests/test_extroot_crash_model.py
          python3 tests/test_extroot_preflight.py
          python3 tests/test_metadata_migration.py
          python3 tests/test_userdata_stage_rsync.py
          python3 tests/test_compare_overlay_upper.py
          python3 tests/test_beta_safety.py
      - name: Bootstrap pinned OpenWrt and feeds
        run: make bootstrap
      - name: Compile without publishing a flashable factory package
        run: bash scripts/build.sh --no-pack
      - name: Capture reproducibility evidence
        if: always()
        run: |
          mkdir -p build-evidence
          {
            printf 'kit=%s\n' "$GITHUB_SHA"
            printf 'base=%s\n' "$E2631_BASE_SHA"
            printf 'packages=%s\n' "$E2631_PACKAGES_SHA"
            printf 'luci=%s\n' "$E2631_LUCI_SHA"
            printf 'status=UNVERIFIED_NOT_A_RELEASE\n'
          } > build-evidence/provenance.txt
          if [ -d "$E2631_TREE" ]; then
            git -C "$E2631_TREE" rev-parse HEAD > build-evidence/base-head.txt || true
          fi
          find "$E2631_OUT" -name world.log -type f -exec cp {} build-evidence/world.log \; -quit 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2631-build-evidence-unverified
          path: build-evidence/
          retention-days: 7
          if-no-files-found: error
