name: Beta source checks

on:
  push:
    branches:
      - 'beta/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install script lint dependencies
        run: sudo apt-get update && sudo apt-get install -y busybox gcc
      - name: Repository source gates
        run: make check
      - name: NAND initializer isolated mocks (never access real MTD)
        run: python3 tests/test_userdata_init.py
      - name: Extroot state-machine simulation (no NAND access)
        run: python3 tests/test_extroot_audit.py
      - name: Crash boundary and marker simulation
        run: python3 tests/test_extroot_crash_model.py
      - name: Extroot read-only preflight mocks
        run: python3 tests/test_extroot_preflight.py
      - name: Metadata audit and fail-closed migration
        run: python3 tests/test_metadata_migration.py
      - name: Guarded rsync stage simulation
        run: python3 tests/test_userdata_stage_rsync.py
      - name: Overlay content and metadata comparator
        run: python3 tests/test_compare_overlay_upper.py
      - name: Beta security regression
        run: python3 tests/test_beta_safety.py
      - name: Fresh-only build profile guard
        run: python3 tests/test_fresh_profile.py
      - name: Explain validation boundary
        run: |
          echo "Static and mock tests only."
          echo "No firmware was built, flashed, or validated on hardware."
